<html>
    <head>
        <title> Student Registration </title>
    </head>
    <body>
        <h2> Student Registration Form </h2>
        <form>
            <label> Student Name: </label>
            <input type="text" name="sname">
            <br>
            <label> Email: </label>
            <input type="email" name="email">
            <br>
            <label> Password: </label>
            <input type="password" name="password" minlength="8" maxlength="15" required>
            <input type="submit" name="Submit">
            <br>
            <label> Age: </label>
            <input type="number" name="age">
            <br>
            <label> Gender: </label>
            <input type="radio" name="gender">Male
            <input type="radio" name="gender">Female
            <br>
            <label> Skills: </label>
            <input type="checkbox" name="skill">HTML
            <input type="checkbox" name="skill">C++
            <input type="checkbox" name="skill">Java
            <br>
            <label> Date Of Birth: </label>
            <input type="date" name="dob">
            <br>
            <label> Department: </label>
            <select name="Department">
                <option> CSE </option>
                <option> AIDS </option>
                <option> ECE </option>
                <option> CSIT </option>
                <br>
                <label> Adress: </label>
                <textarea rows="4" cols="3"></textarea>
            </select>
        </form>
    </body>
</html>
