<html>
    <head>
        <title> Student Information </title>
    </head>
    <body align="center">
        <h2> Student Registration Form </h2>
        <form>
            <lable> Student Name: </lable>
            <input type = "text" name= "sname" placeholder="Enter name">
            <br><br>
            <label> Email: </label>
            <input type = "email" name = "email" placeholder="Enter email">
            <br><br>
            <label> Password: </label>
            <input type = "password" name = "password" required>
            <br><br>
            <label> Age: </label>
            <input type="number" name="age" required>
            <br><br>
            <label> Gender: </label>
            <input type="radio" name="gender">Male
            <input type="radio" name="gender">Female
            <br><br>
            <label> Skills: </label>
            <input type="checkbox" name="skills">HTML
            <input type="checkbox" name="skills">Java
            <input type="checkbox" name="skills">CSS
            <br><br>
            <label>Date Of Birth: </label>
            <input type="date" name="dob">
            <br><br>
             <label>Address:</label>
            <textarea rows="4" cols="30"></textarea>
            <br><br>
            <label> Department: </label>
            <select name="Department">
            <option>AIDS</option>
            <option>CSE</option>
            <option>CSIT</option>
            <option>ECE</option>
            </select>
            <br><br>
           
            <br><label> Are you a Robot? </label>
            <input type="checkbox" name="Are you a Robot?" required>
            <br><br>
            <input type="submit" value="Register">
            <input type="reset" value="Clear">
        </form>
    </body>
</html>
