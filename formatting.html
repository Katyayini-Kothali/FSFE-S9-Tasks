<html>
    <head>
        <title> Formatting text </title>
    </head>
    <body>
        <h1> Welcome to HTML5</h1>
        <p>
            This is a <b> Bold Text</b><br>
            This is an <i> Italic Text</i><br>
            This is an <u> Underlined Text</u><br>
            This is a <s> Strikethrough Text</s><br>
            This is a <mark> Highlighted text</mark>
        </p>
    </body>
</html>
